[project]
name = "inkwell-ai-server"
version = "0.0.1"
description = "Inkwell AI server: device API, Postgres-backed job queue, worker, blob store."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4,<25.0",
    "anthropic>=0.40,<1.0",
]

[project.scripts]
inkwell = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom relies on calling Depends()/Query() in
# parameter defaults; these are not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
