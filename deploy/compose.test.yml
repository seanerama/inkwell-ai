# Local gate database only (Postgres). The `server-test` gate needs a real Postgres;
# bring this up first:  docker compose -f deploy/compose.test.yml up -d postgres
# then run the gates with DATABASE_URL pointing at it. CI uses a service container
# instead of this file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: inkwell
      POSTGRES_DB: inkwell
    ports:
      - "${INKWELL_TEST_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell"]
      interval: 2s
      timeout: 3s
      retries: 30
