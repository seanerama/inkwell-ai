# Inkwell AI — Android version catalog (single source of dependency versions).
# Dependency locking is enabled (see build.gradle.kts); run `./gradlew
# dependencies --write-locks` to (re)generate the committed gradle.lockfile.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
coreKtx = "1.13.1"
lifecycle = "2.8.4"
activityCompose = "1.9.1"
composeBom = "2024.06.00"
composeCompiler = "1.5.14"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.6.3"
kotlinxSerializationConverter = "1.0.0"
kotlinxCoroutines = "1.8.1"
securityCrypto = "1.1.0-alpha06"
work = "2.9.1"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
