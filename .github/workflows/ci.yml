name: CI
# Inkwell AI — Verity hygiene gate (stack-agnostic).
# Secret-scan + a structure check, no faked pass. Project gates (lint/test/…)
# live in ONE committed place — .verity/gates.json — executed by the `gates`
# job below AND by the Verity local gate runner (stage 82, ADR-0029 §4), so CI
# can never drift from the gates that were green locally.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Verity single-source gates (stage 82, ADR-0029 §4): this job executes the
  # SAME committed `.verity/gates.json` the local gate runner executes —
  # ordered, named commands judged by EXIT CODE only (ADR-0028). The server
  # gates need `uv` and a real Postgres (the `server-test` and `migration-check`
  # gates read DATABASE_URL); Docker and Node are preinstalled on the runner for
  # the `image-build` and `compose-config` gates.
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkwell"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://inkwell:inkwell@localhost:5432/inkwell
      INKWELL_TOKEN_PEPPER: ci-pepper
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
      - name: Run the committed gate definition (.verity/gates.json)
        run: node .verity/run-gates.cjs
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          for f in README.md LICENSE; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
