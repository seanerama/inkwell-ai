name: Release
# Inkwell AI server release (ADR-0002): on a v* tag, build and push the multi-arch
# server image to GHCR and create the GitHub Release. The signed Android APK lane is
# added by Stage 2; Stage 1 ships the server image only.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io
jobs:
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seanerama/inkwell-ai-server:${{ github.ref_name }}
            ghcr.io/seanerama/inkwell-ai-server:latest
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Inkwell AI server `${{ github.ref_name }}`.

            Image: `ghcr.io/seanerama/inkwell-ai-server:${{ github.ref_name }}`
            (multi-arch: linux/amd64, linux/arm64).
